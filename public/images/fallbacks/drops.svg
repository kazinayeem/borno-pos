<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="drpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="drpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="drpShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#drpBg)"/>

  <!-- Dropper Bottle Group -->
  <g filter="url(#drpShadow)">
    <!-- Dropper Tip (Nozzle) -->
    <path d="M 52 24 L 56 16 L 60 24 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Screw Cap with ridges -->
    <rect x="46" y="24" width="20" height="14" rx="2" fill="#2563eb"/>
    <line x1="50" y1="27" x2="50" y2="35" stroke="#93c5fd" stroke-width="1.2"/>
    <line x1="56" y1="27" x2="56" y2="35" stroke="#93c5fd" stroke-width="1.2"/>
    <line x1="62" y1="27" x2="62" y2="35" stroke="#93c5fd" stroke-width="1.2"/>

    <!-- Tamper Ring -->
    <rect x="48" y="38" width="16" height="4" rx="1" fill="#1d4ed8"/>

    <!-- Bottle Body (Small Ophthalmic Squeeze Bottle) -->
    <path d="M 44 42 C 44 42, 48 44, 56 44 C 64 44, 68 42, 68 42 C 74 46, 76 52, 76 60 L 76 86 C 76 92, 70 96, 62 96 L 50 96 C 42 96, 36 92, 36 86 L 36 60 C 36 52, 38 46, 44 42 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Liquid inside -->
    <path d="M 38 66 C 44 65, 52 68, 60 66 C 68 64, 72 67, 74 66 L 74 86 C 74 90, 70 94, 64 94 L 48 94 C 42 94, 38 90, 38 86 Z" fill="url(#drpBlue)" fill-opacity="0.25"/>

    <!-- Eye Icon on label -->
    <g transform="translate(46, 52)">
      <path d="M 2 12 Q 10 4 18 12 Q 10 20 2 12 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <circle cx="10" cy="12" r="3.5" fill="#2563eb"/>
    </g>
  </g>

  <!-- Big Falling Drop on the right -->
  <g filter="url(#drpShadow)">
    <path d="M 90 42 C 90 34, 98 22, 98 22 C 98 22, 106 34, 106 42 C 106 48, 102 53, 98 53 C 94 53, 90 48, 90 42 Z" fill="url(#drpBlue)"/>
    <!-- Highlight curve -->
    <path d="M 94 40 A 4 4 0 0 1 97 34" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
