<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="inhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="canisterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="inhShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#inhBg)"/>

  <!-- Inhaler Body -->
  <g filter="url(#inhShadow)">
    <!-- Top Canister -->
    <rect x="42" y="18" width="26" height="24" rx="4" fill="url(#canisterGrad)" stroke="#64748b" stroke-width="1.2"/>
    <line x1="48" y1="22" x2="48" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Plastic Actuator Sleeve (L-shape) -->
    <path d="M 38 34 L 72 34 L 72 74 L 98 74 C 102 74, 104 77, 104 82 L 104 90 C 104 95, 100 98, 94 98 L 48 98 C 42 98, 38 94, 38 88 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>

    <!-- Mouthpiece Cap Accent -->
    <rect x="88" y="76" width="14" height="20" rx="3" fill="#1e40af"/>

    <!-- Dose Counter window -->
    <rect x="46" y="50" width="18" height="12" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="55" y="59" font-family="sans-serif" font-size="8" font-weight="800" fill="#2563eb" text-anchor="middle">120</text>
  </g>

  <!-- Aerosol Mist Plume coming from mouthpiece -->
  <g opacity="0.8">
    <circle cx="106" cy="86" r="3" fill="#38bdf8"/>
    <circle cx="112" cy="82" r="4.5" fill="#7dd3fc"/>
    <circle cx="114" cy="92" r="3.5" fill="#7dd3fc"/>
    <circle cx="118" cy="86" r="2.5" fill="#bae6fd"/>
  </g>
</svg>
