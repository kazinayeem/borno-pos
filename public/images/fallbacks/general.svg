<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="genBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="genBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="genShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#genBg)"/>

  <!-- Pharmacy Cross Caduceus / Mortar & Pill Shield -->
  <g filter="url(#genShadow)">
    <!-- Base Hexagon / Shield -->
    <path d="M 60 18 L 94 36 L 94 80 L 60 98 L 26 80 L 26 36 Z" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>

    <!-- Inner Medical Plus Cross -->
    <path d="M 60 34 L 60 82 M 36 58 L 84 58" stroke="url(#genBlue)" stroke-width="12" stroke-linecap="round"/>

    <!-- Centered Pill Overlay Accent -->
    <g transform="rotate(-30 60 58)">
      <rect x="46" y="52" width="28" height="12" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
      <path d="M 46 58 L 60 58" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="53" cy="58" r="2" fill="#3b82f6"/>
    </g>
  </g>
</svg>
