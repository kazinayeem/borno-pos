<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="supBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="supBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="supShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#supBg)"/>

  <!-- Left Suppository (Torpedo Shape) -->
  <g transform="rotate(-15 48 60)" filter="url(#supShadow)">
    <path d="M 40 44 C 40 26, 56 26, 56 44 L 56 82 C 56 88, 40 88, 40 82 Z" fill="url(#supBody)" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="48" cy="82" rx="7" ry="2.5" fill="#e2e8f0"/>
    <path d="M 44 40 C 44 32, 50 32, 52 40 L 52 76" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Suppository (Torpedo Shape with blue accent) -->
  <g transform="rotate(20 74 62)" filter="url(#supShadow)">
    <path d="M 66 40 C 66 22, 82 22, 82 40 L 82 78 C 82 84, 66 84, 66 78 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <path d="M 70 38 C 70 30, 76 30, 78 38 L 78 72" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="74" cy="78" rx="7" ry="2.5" fill="#dbeafe"/>
  </g>

  <!-- Foil Blister outline accent -->
  <rect x="24" y="24" width="72" height="72" rx="12" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
