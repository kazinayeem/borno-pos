<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="injBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="vialLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="injShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#injBg)"/>

  <!-- Medicine Vial on the left -->
  <g filter="url(#injShadow)">
    <!-- Vial Cap (Rubber + Crimp) -->
    <rect x="26" y="32" width="22" height="7" rx="2" fill="#2563eb"/>
    <rect x="29" y="39" width="16" height="5" fill="#94a3b8"/>

    <!-- Glass Vial Body -->
    <rect x="22" y="44" width="30" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Liquid inside vial -->
    <rect x="24" y="60" width="26" height="30" rx="4" fill="url(#vialLiquid)" fill-opacity="0.85"/>

    <!-- Vial Label -->
    <rect x="23" y="52" width="28" height="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="28" y1="58" x2="44" y2="58" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="63" x2="38" y2="63" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Vial reflection -->
    <line x1="26" y1="48" x2="26" y2="88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Precision Syringe on the right tilted -->
  <g transform="rotate(35 78 58)" filter="url(#injShadow)">
    <!-- Needle -->
    <line x1="78" y1="14" x2="78" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Syringe Hub -->
    <polygon points="75,28 81,28 79,34 77,34" fill="#3b82f6"/>

    <!-- Syringe Barrel -->
    <rect x="73" y="34" width="10" height="44" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>

    <!-- Liquid in Syringe -->
    <rect x="74" y="46" width="8" height="24" fill="#38bdf8" fill-opacity="0.7"/>

    <!-- Graduations -->
    <line x1="79" y1="40" x2="82" y2="40" stroke="#64748b" stroke-width="1"/>
    <line x1="78" y1="48" x2="82" y2="48" stroke="#64748b" stroke-width="1"/>
    <line x1="79" y1="56" x2="82" y2="56" stroke="#64748b" stroke-width="1"/>
    <line x1="78" y1="64" x2="82" y2="64" stroke="#64748b" stroke-width="1"/>

    <!-- Plunger & Stopper -->
    <rect x="74" y="68" width="8" height="4" fill="#1e293b"/>
    <rect x="77" y="72" width="2" height="18" fill="#94a3b8"/>
    <!-- Plunger Top Flange -->
    <ellipse cx="78" cy="90" rx="7" ry="2.5" fill="#3b82f6"/>

    <!-- Finger Grips -->
    <rect x="68" y="76" width="20" height="3" rx="1.5" fill="#94a3b8"/>
  </g>
</svg>
