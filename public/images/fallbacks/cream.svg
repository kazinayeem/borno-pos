<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="crmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="tubeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="crmShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#crmBg)"/>

  <!-- Medical Tube Tilted -->
  <g transform="rotate(-28 55 60)" filter="url(#crmShadow)">
    <!-- Tube End Crimp -->
    <path d="M 38 24 L 62 24 L 60 29 L 40 29 Z" fill="#94a3b8"/>
    <line x1="42" y1="26" x2="58" y2="26" stroke="#475569" stroke-width="1" stroke-dasharray="2 1"/>

    <!-- Tube Body -->
    <path d="M 40 29 L 60 29 L 56 74 L 44 74 Z" fill="url(#tubeBody)" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Tube Decorative Brand Band -->
    <path d="M 41.5 42 L 58.5 42 L 57.5 54 L 42.5 54 Z" fill="#2563eb"/>
    <line x1="45" y1="48" x2="55" y2="48" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Tube Shoulder -->
    <path d="M 44 74 L 56 74 L 54 80 L 46 80 Z" fill="#cbd5e1"/>

    <!-- Screw Cap -->
    <rect x="44" y="80" width="12" height="14" rx="2" fill="#1d4ed8"/>
    <line x1="47" y1="83" x2="47" y2="91" stroke="#60a5fa" stroke-width="1"/>
    <line x1="50" y1="83" x2="50" y2="91" stroke="#60a5fa" stroke-width="1"/>
    <line x1="53" y1="83" x2="53" y2="91" stroke="#60a5fa" stroke-width="1"/>
  </g>

  <!-- Cream Swirl / Dab -->
  <g filter="url(#crmShadow)">
    <path d="M 72 84 C 74 76, 88 74, 92 80 C 96 86, 92 92, 84 94 C 76 96, 70 92, 72 84 Z" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <path d="M 78 80 C 84 78, 88 82, 88 86" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
