<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="capBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="capBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="capCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="capWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="capShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#capBg)"/>

  <!-- Background decorative ring -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Primary Tilted Capsule -->
  <g transform="rotate(-35 56 60)" filter="url(#capShadow)">
    <!-- Top Half (Blue) -->
    <path d="M 44 32 C 44 24, 68 24, 68 32 L 68 58 L 44 58 Z" fill="url(#capBlue)"/>
    <!-- Top highlight -->
    <path d="M 48 29 C 48 26, 56 26, 56 29 L 56 52" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Half (White) -->
    <path d="M 44 58 L 68 58 L 68 86 C 68 94, 44 94, 44 86 Z" fill="url(#capWhite)" stroke="#cbd5e1" stroke-width="0.75"/>
    <path d="M 48 64 L 48 84" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>

    <!-- Joint band ring -->
    <line x1="43" y1="58" x2="69" y2="58" stroke="#1e40af" stroke-width="2.5"/>
  </g>

  <!-- Secondary Smaller Capsule in front -->
  <g transform="rotate(45 80 72)" filter="url(#capShadow)">
    <!-- Left Half (Cyan) -->
    <path d="M 72 60 C 72 55, 88 55, 88 60 L 88 74 L 72 74 Z" fill="url(#capCyan)"/>
    <!-- Right Half (White) -->
    <path d="M 72 74 L 88 74 L 88 88 C 88 93, 72 93, 72 88 Z" fill="url(#capWhite)" stroke="#cbd5e1" stroke-width="0.5"/>
    <line x1="71" y1="74" x2="89" y2="74" stroke="#0e7490" stroke-width="2"/>
  </g>
</svg>
