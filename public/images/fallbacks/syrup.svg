<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="syrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="liquidBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="syrShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#syrBg)"/>

  <!-- Bottle Group -->
  <g filter="url(#syrShadow)">
    <!-- Cap -->
    <rect x="46" y="22" width="28" height="14" rx="4" fill="#2563eb"/>
    <line x1="50" y1="26" x2="50" y2="32" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="56" y1="26" x2="56" y2="32" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="64" y1="26" x2="64" y2="32" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="70" y1="26" x2="70" y2="32" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="50" y="36" width="20" height="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>

    <!-- Bottle Body -->
    <path d="M 40 44 C 40 44, 48 44, 50 44 L 70 44 C 72 44, 80 44, 80 44 C 85 47, 86 52, 86 58 L 86 92 C 86 98, 82 100, 76 100 L 44 100 C 38 100, 34 98, 34 92 L 34 58 C 34 52, 35 47, 40 44 Z" fill="url(#bottleGlass)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Medicine Liquid in bottle -->
    <path d="M 36 66 C 42 64, 48 68, 60 65 C 72 62, 78 66, 84 66 L 84 92 C 84 96, 80 98, 76 98 L 44 98 C 40 98, 36 96, 36 92 Z" fill="url(#liquidBlue)" fill-opacity="0.85"/>

    <!-- Glass Reflection Highlight -->
    <path d="M 40 50 L 40 92" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"/>

    <!-- Measurement ticks on bottle -->
    <line x1="76" y1="56" x2="82" y2="56" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="78" y1="64" x2="82" y2="64" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="76" y1="72" x2="82" y2="72" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="78" y1="80" x2="82" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="76" y1="88" x2="82" y2="88" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Label with medical cross -->
    <rect x="46" y="70" width="28" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Medical Cross -->
    <path d="M 60 74 L 60 86 M 54 80 L 66 80" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Droplet beside bottle -->
  <path d="M 94 80 C 94 75, 99 68, 99 68 C 99 68, 104 75, 104 80 C 104 84, 101.5 87, 99 87 C 96.5 87, 94 84, 94 80 Z" fill="#38bdf8" filter="url(#syrShadow)"/>
</svg>
