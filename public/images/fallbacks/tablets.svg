<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e0effe"/>
    </linearGradient>
    <linearGradient id="tabBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tabWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="tabShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="120" height="120" rx="16" fill="url(#tabBg)"/>

  <!-- Blister pack outline subtle in background -->
  <rect x="22" y="24" width="76" height="72" rx="10" fill="#ffffff" fill-opacity="0.4" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Left Round Tablet (White with blue groove) -->
  <g filter="url(#tabShadow)">
    <circle cx="48" cy="64" r="22" fill="url(#tabWhite)" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="48" cy="62" rx="20" ry="19" fill="#ffffff"/>
    <!-- Score line -->
    <line x1="32" y1="62" x2="64" y2="62" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Highlight curve -->
    <path d="M 34 52 A 18 18 0 0 1 58 46" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Round Tablet (BornoPos Blue with white groove) -->
  <g filter="url(#tabShadow)">
    <circle cx="74" cy="52" r="20" fill="url(#tabBlue)"/>
    <ellipse cx="74" cy="50" rx="18" ry="17" fill="#2563eb"/>
    <!-- Score line -->
    <line x1="61" y1="43" x2="87" y2="57" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <!-- Pill reflection -->
    <path d="M 62 42 A 15 15 0 0 1 82 38" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small accent tablet front -->
  <g filter="url(#tabShadow)">
    <ellipse cx="64" cy="78" rx="12" ry="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="56" y1="78" x2="72" y2="78" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
