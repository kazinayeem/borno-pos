<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="devBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="devShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="120" height="120" rx="16" fill="url(#devBg)"/>

  <!-- Digital Thermometer Tilted -->
  <g transform="rotate(-40 60 60)" filter="url(#devShadow)">
    <!-- Metal Sensor Tip -->
    <path d="M 58 14 C 58 10, 62 10, 62 14 L 62 26 L 58 26 Z" fill="#94a3b8"/>

    <!-- Thermometer Probe -->
    <rect x="58.5" y="26" width="3" height="24" fill="#cbd5e1"/>

    <!-- Plastic Body -->
    <path d="M 56 50 L 64 50 L 67 92 C 67 98, 53 98, 53 92 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Blue Grip Accent -->
    <path d="M 54 84 L 66 84 L 67 92 C 67 98, 53 98, 53 92 Z" fill="#2563eb"/>

    <!-- Digital LCD Display -->
    <rect x="56" y="58" width="8" height="18" rx="1.5" fill="#e0f2fe" stroke="#64748b" stroke-width="0.75"/>
    <text x="60" y="70" font-family="sans-serif" font-size="5" font-weight="800" fill="#0369a1" text-anchor="middle">36.8</text>

    <!-- Power button -->
    <circle cx="60" cy="80" r="1.5" fill="#3b82f6"/>
  </g>

  <!-- First Aid Shield & Cross on top-right -->
  <g transform="translate(76, 20)" filter="url(#devShadow)">
    <path d="M 14 0 L 28 4 L 28 16 C 28 26, 14 32, 14 32 C 14 32, 0 26, 0 16 L 0 4 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 14 8 L 14 24 M 6 16 L 22 16" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
